<!-- @dsCard group="BPMN" height=450 -->
<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>ElementoBPMN — vista previa</title></head>
<body>
<div id="root" class="kz-demo kz-demo--white"></div>
<script>
  var K = window.Kaze, h = React.createElement;
  function celda(props, rotulo, clave) {
    return h('figure', { key: clave, style: { margin: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 } },
      h(K.ElementoBPMN, Object.assign({ escala: 0.72 }, props)),
      h('figcaption', { style: { fontSize: 11.5, color: 'var(--color-apagado)', textAlign: 'center', maxWidth: 110 } }, rotulo));
  }
  var rejilla = { display: 'grid', gridTemplateColumns: 'repeat(6, auto)', gap: '18px 28px', alignItems: 'end', justifyItems: 'center' };
  var rotulo = { fontSize: 11, fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--color-apagado)', margin: '0 0 10px' };
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 22 } },
    h('div', { style: rejilla },
      [['inicio', 'Inicio'], ['tarea', 'Tarea'], ['subproceso', 'Subproceso'], ['exclusiva', 'Exclusiva'], ['inclusiva', 'Inclusiva'], ['paralela', 'Paralela'], ['fin', 'Fin'], ['datos', 'Entregable'], ['secuencia', 'Secuencia'], ['mensaje', 'Mensaje'], ['sugerida', 'Sugerida IA'], ['grupo', 'Fase (Group)']].map(function (e) {
        return celda({ tipo: e[0], etiqueta: e[0] === 'tarea' ? 'Validar' : undefined, estado: e[0] === 'tarea' ? 'seleccionado' : undefined }, e[1], e[0]);
      })),
    h('div', null, h('p', { style: rotulo }, 'Quién la ejecuta, formatos y ciclo'),
      h('div', { style: rejilla },
        celda({ tipo: 'tarea', etiqueta: 'Revisar', ejecutor: 'persona' }, 'Persona', 'p'),
        celda({ tipo: 'tarea', etiqueta: 'Cruzar', ejecutor: 'sistema' }, 'Sistema', 's'),
        celda({ tipo: 'tarea', etiqueta: 'Clasificar', ejecutor: 'automatizacion' }, 'IA o automatización', 'a'),
        celda({ tipo: 'tarea', etiqueta: 'Registrar', ejecutor: 'persona', adjunto: true }, 'Con formatos', 'f'),
        celda({ tipo: 'tarea', etiqueta: 'Investigar', ejecutor: 'persona', ciclo: 'porCadaSecuencial' }, 'Por cada, uno tras otro', 'c'),
        celda({ tipo: 'tarea', etiqueta: 'Reintentar', ejecutor: 'sistema', ciclo: 'repite' }, 'Se repite', 'r'))),
    h('div', null, h('p', { style: rotulo }, 'Eventos de la ficha'),
      h('div', { style: rejilla },
        celda({ tipo: 'inicio', marcador: 'tiempo' }, 'Inicio programado', 'i1'),
        celda({ tipo: 'intermedio', marcador: 'tiempo' }, 'Espera un tiempo', 'e1'),
        celda({ tipo: 'intermedio', marcador: 'mensaje' }, 'Espera un mensaje', 'e2'),
        celda({ tipo: 'intermedio', marcador: 'aviso' }, 'Envía un aviso', 'e3'),
        celda({ tipo: 'intermedio', marcador: 'condicion' }, 'Espera una condición', 'e4'),
        celda({ tipo: 'intermedio', marcador: 'error' }, 'Error (en el borde)', 'e5')))));
</script>
</body>
</html>
