/**
 * outline styles
 */

.djs-outline,
.djs-selection-outline {
  fill: none;
  shape-rendering: geometricPrecision;
  stroke-width: 2px;
}

.djs-outline {
  visibility: hidden;
}

.djs-selection-outline {
  stroke: var(--element-selected-outline-stroke-color);
}

.djs-element.selected .djs-outline {
  visibility: visible;

  stroke: var(--element-selected-outline-stroke-color);
}

.djs-connection.selected .djs-outline {
  display: none;
}

.djs-multi-select .djs-element.selected .djs-outline {
  stroke: var(--element-selected-outline-secondary-stroke-color);
  display: block;
}

.djs-shape.connect-ok .djs-visual > :nth-child(1) {
  fill: var(--shape-connect-allowed-fill-color) !important;
}

.djs-shape.connect-not-ok .djs-visual > :nth-child(1),
.djs-shape.drop-not-ok .djs-visual > :nth-child(1) {
  fill: var(--shape-drop-not-allowed-fill-color) !important;
}

.djs-shape.new-parent .djs-visual > :nth-child(1) {
  fill: var(--shape-drop-allowed-fill-color) !important;
}

svg.drop-not-ok {
  background: var(--shape-drop-not-allowed-fill-color) !important;
}

svg.new-parent {
  background: var(--shape-drop-allowed-fill-color) !important;
}


/* Override move cursor during drop and connect */
.drop-not-ok,
.connect-not-ok,
.drop-not-ok *,
.connect-not-ok * {
  cursor: not-allowed !important;
}

.drop-ok,
.connect-ok,
.drop-ok *,
.connect-ok * {
  cursor: default !important;
}

.djs-element.attach-ok .djs-visual > :nth-child(1) {
  stroke-width: 5px !important;
  stroke: var(--shape-attach-allowed-stroke-color) !important;
}

.djs-frame.connect-not-ok .djs-visual > :nth-child(1),
.djs-frame.drop-not-ok .djs-visual > :nth-child(1) {
  stroke-width: 3px !important;
  stroke: var(--shape-drop-not-allowed-fill-color) !important;
  fill: none !important;
}

/**
* Selection box style
*
*/

  fill: var(--lasso-fill-color);
  stroke: var(--lasso-stroke-color);
  stroke-width: 2px;
  shape-rendering: geometricPrecision;
  pointer-events: none;
}

/**
 * Resize styles
 */
.djs-resize-overlay {
  fill: none;

  stroke-dasharray: 5 1 3 1;
  stroke: var(--shape-resize-preview-stroke-color);

  pointer-events: none;
}

.djs-resizer-hit {
  fill: none;
  pointer-events: all;
}

.djs-resizer-visual {
  fill: var(--resizer-fill-color);
  stroke-width: 1px;
  stroke: var(--resizer-stroke-color);
  shape-rendering: geometricPrecision;
}

.djs-resizer:hover .djs-resizer-visual {
  stroke: var(--resizer-stroke-color);
  stroke-opacity: 1;
}

.djs-cursor-resize-ns,
.djs-resizer-n,
.djs-resizer-s {
  cursor: ns-resize;
}

.djs-cursor-resize-ew,
.djs-resizer-e,
.djs-resizer-w {
  cursor: ew-resize;
}

.djs-cursor-resize-nwse,
.djs-resizer-nw,
.djs-resizer-se {
  cursor: nwse-resize;
}

.djs-cursor-resize-nesw,
.djs-resizer-ne,
.djs-resizer-sw {
  cursor: nesw-resize;
}

.djs-shape.djs-resizing > .djs-outline {
  visibility: hidden !important;
}

.djs-shape.djs-resizing > .djs-resizer {
  visibility: hidden;
}

.djs-dragger > .djs-resizer {
  visibility: hidden;
}

/**

 */

}

.djs-dragger tspan,
.djs-dragger text {
  fill: var(--element-dragger-color) !important;
  stroke: none !important;
}

.djs-dragger marker circle,
.djs-dragger marker path,
.djs-dragger marker polygon,
.djs-dragger marker polyline,
.djs-dragger marker rect {
  fill: var(--element-dragger-color) !important;
  stroke: none !important;
}

.djs-dragger marker text,
.djs-dragger marker tspan {
  fill: none !important;
  stroke: var(--element-dragger-color) !important;
}

.djs-dragging,
.djs-dragging > * {
  opacity: 0.3 !important;
  pointer-events: none !important;
}

/**
 * no pointer events for visual
 */
.djs-visual,
.djs-outline {
  pointer-events: none;
}

.djs-element.attach-ok .djs-hit {
  stroke-width: 60px !important;
}

/**

 */
.djs-element > .djs-hit-all,
.djs-element > .djs-hit-no-move {
  pointer-events: all;
}

.djs-element > .djs-hit-stroke,
.djs-element > .djs-hit-click-stroke {
  pointer-events: stroke;
}

/**
 * shape / connection basic styles
 */
.djs-connection .djs-visual {
  stroke-width: 2px;
  fill: none;
}

.djs-cursor-grab {
  cursor: -webkit-grab;
  cursor: -moz-grab;
  cursor: grab;
}

.djs-cursor-grabbing {
  cursor: -webkit-grabbing;
  cursor: -moz-grabbing;
  cursor: grabbing;
}

.djs-cursor-crosshair {
  cursor: crosshair;
}

.djs-cursor-move {
  cursor: move;
}

.djs-cursor-resize-ns {
  cursor: ns-resize;
}

.djs-cursor-resize-ew {
  cursor: ew-resize;
}


/**
 * snapping
 */
.djs-snap-line {
  stroke: var(--snap-line-stroke-color);
  stroke-linecap: round;
  stroke-width: 2px;
  pointer-events: none;
}

/**
 * snapping
 */
.djs-crosshair {
  stroke: var(--space-tool-crosshair-stroke-color);

  stroke-width: 1px;

  shape-rendering: geometricPrecision;

/**
 * palette
 */

.djs-palette {
  position: absolute;
  left: 20px;
  top: 20px;

  box-sizing: border-box;
  width: 48px;
}

.djs-palette .separator {
  margin: 5px;
  padding-top: 5px;

  border: none;
  border-bottom: solid 1px var(--palette-separator-color);

  clear: both;
}

.djs-palette .entry:before {
  vertical-align: initial;
}

.djs-palette .djs-palette-toggle {
  cursor: pointer;
}

.djs-palette .entry,
.djs-palette .djs-palette-toggle {
  color: var(--palette-entry-color);

  text-align: center;
}

.djs-palette .entry {
  float: left;
}

.djs-palette .entry img {
  max-width: 100%;
}

.djs-palette .djs-palette-entries:after {
  content: '';

  clear: both;
}

.djs-palette .djs-palette-toggle:hover {
  background: var(--palette-toggle-hover-background-color);
}

.djs-palette .entry:hover {
  color: var(--palette-entry-hover-color);
}

.djs-palette .highlighted-entry {
  color: var(--palette-entry-selected-color) !important;
}

.djs-palette .entry,
.djs-palette .djs-palette-toggle {
  width: 46px;
  height: 46px;
  line-height: 46px;
  cursor: default;
}

/**
 * Palette open / two-column layout is controlled via
 * classes on the palette. Events to hook into palette

 */
.djs-palette.two-column.open {
  width: 94px;
}

.djs-palette:not(.open) .djs-palette-entries {
  display: none;
}

.djs-palette:not(.open) {
  overflow: hidden;
}

.djs-palette.open .djs-palette-toggle {
  display: none;
}

/**
 * context-pad
 */
.djs-context-pad {
  position: absolute;
  display: none;
  pointer-events: none;
  line-height: 1;
  width: 72px;
  z-index: 100;
}

.djs-context-pad .entry {
  width: 22px;
  height: 22px;

  display: inline-block;
  font-size: 22px;
  margin: 0 2px 2px 0;

  border-radius: 3px;

  cursor: default;

  background-color: var(--context-pad-entry-background-color);
  box-shadow: 0 0 2px 1px var(--context-pad-entry-background-color);
  pointer-events: all;
  vertical-align: middle;
}

.djs-context-pad .entry:hover {
  background: var(--context-pad-entry-hover-background-color);
}

.djs-context-pad.open {
  display: block;
}

 * popup styles
 */

  line-height: 1;
  box-sizing: border-box;

  border: solid 1px var(--popup-border-color);

  display: flex;
  flex-direction: row;
  align-items: stretch;

.djs-popup-title,

.djs-popup-entry-description,

.djs-bendpoint {

}

  stroke: var(--bendpoint-stroke-color);

  display: block;
}

.djs-bendpoint .djs-visual {
  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-width: 1px;
}

.djs-segment-dragger:hover,
.djs-bendpoints.hover .djs-segment-dragger,
.djs-bendpoints.selected .djs-segment-dragger,
.djs-bendpoint:hover,
.djs-bendpoints.hover .djs-bendpoint,
.djs-bendpoints.selected .djs-bendpoint {
  display: block;
}

.djs-drag-active .djs-bendpoints * {
  display: none;
}

.djs-bendpoints:not(.hover) .floating {
  display: none;
}

.djs-segment-dragger:hover .djs-visual,
.djs-segment-dragger.djs-dragging .djs-visual,
.djs-bendpoint:hover .djs-visual,
.djs-bendpoint.floating .djs-visual {
  fill: var(--bendpoint-fill-color);
  stroke: var(--bendpoint-stroke-color);
  stroke-opacity: 1;
}

.djs-bendpoint.floating .djs-hit {
  pointer-events: none;
}

.djs-segment-dragger .djs-hit,
.djs-bendpoint .djs-hit {
  fill: none;
  pointer-events: all;
}

.djs-segment-dragger.horizontal .djs-hit {
  cursor: ns-resize;
}

.djs-segment-dragger.vertical .djs-hit {
  cursor: ew-resize;
}

.djs-segment-dragger.djs-dragging .djs-hit {
  pointer-events: none;
}

.djs-updating,
.djs-updating > * {
  pointer-events: none !important;
}

.djs-updating .djs-context-pad,
.djs-updating .djs-outline,
.djs-updating .djs-bendpoint,
.djs-multi-select .djs-bendpoint,
.djs-multi-select .djs-segment-dragger,
.connect-ok .djs-bendpoint,
.connect-not-ok .djs-bendpoint,
.drop-ok .djs-bendpoint,
.drop-not-ok .djs-bendpoint {
  display: none !important;
}

.djs-segment-dragger.djs-dragging,
.djs-bendpoint.djs-dragging {
  display: block;
  opacity: 1.0;
}


/**
 * tooltips
 */
.djs-tooltip-error {
  width: 160px;
  padding: 6px;

  background: var(--tooltip-error-background-color);
  border: solid 1px var(--tooltip-error-border-color);
  border-radius: 2px;
  color: var(--tooltip-error-color);
  font-size: 12px;
  line-height: 16px;

  opacity: 0.75;
}

.djs-tooltip-error:hover {
  opacity: 1;
}


/**
 * search pad
 */
.djs-search-open .djs-context-pad {
  display: none;
}

.djs-search-open .djs-connection.selected .djs-outline {
  display: block;
}

.djs-search-container {
  position: absolute;
  top: 20px;
  left: 0;
  right: 0;
  margin-left: auto;
  margin-right: auto;

  width: 25%;
  min-width: 300px;
  max-width: 400px;
  z-index: 10;

  font-family: var(--search-font-family);
  font-size: var(--search-font-size);
  border-radius: 2px;
  box-shadow: 0px 2px 6px var(--search-shadow-color);
}

.djs-search-container:not(.open) {
  display: none;
}

.djs-search-input {
  position: relative;
}

.djs-search-input svg {
  position: absolute;
  left: 8px;
  top: 7px;
}

.djs-search-input input {
  font-size: var(--search-font-size);
  width: 100%;
  padding: 3px 6px 3px 28px;
  border: 1px solid var(--search-input-border-color);
  border-radius: 2px;
  box-sizing: border-box;
  line-height: 21px;
}

.djs-search-input input:focus {
  background-color: var(--search-input-focus-background-color);
  border: solid 1px var(--search-input-focus-border-color);
  outline: none;
}

.djs-search-results {
  position: relative;
  overflow-y: auto;
  max-height: 200px;
  background: var(--search-container-background-color);
}

.djs-search-result {
  padding: 6px 8px;
}

.djs-search-result-primary {
  margin: 0 0 3px;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}

.djs-search-result-secondary {
  font-family: monospace;
  margin: 0;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
  color: var(--search-result-secondary-color);
}

.djs-search-result:hover {
  background: var(--search-result-hover-background-color);
}

.djs-search-result-selected {
  background: var(--search-result-hover-background-color);
}

.djs-search-result-selected:hover {
  background: var(--search-result-hover-background-color);
}

/**
 * hidden styles
 */
.djs-element-hidden,
.djs-element-hidden .djs-hit,
.djs-element-hidden .djs-outline,
.djs-label-hidden .djs-label {
  display: none !important;
}

.djs-element .djs-hit-stroke,
.djs-element .djs-hit-click-stroke,
.djs-element .djs-hit-all {
  cursor: move;
}
.bjs-container {
  --bjs-font-family: Arial, sans-serif;

  --color-grey-225-10-15: hsl(225, 10%, 15%);
  --color-grey-225-10-35: hsl(225, 10%, 35%);
  --color-grey-225-10-55: hsl(225, 10%, 55%);
  --color-grey-225-10-75: hsl(225, 10%, 75%);
  --color-grey-225-10-80: hsl(225, 10%, 80%);
  --color-grey-225-10-85: hsl(225, 10%, 85%);
  --color-grey-225-10-90: hsl(225, 10%, 90%);
  --color-grey-225-10-95: hsl(225, 10%, 95%);
  --color-grey-225-10-97: hsl(225, 10%, 97%);

  --color-blue-205-100-45: hsl(205, 100%, 45%);
  --color-blue-205-100-45-opacity-30: hsla(205, 100%, 45%, 30%);
  --color-blue-205-100-50: hsl(205, 100%, 50%);
  --color-blue-205-100-95: hsl(205, 100%, 95%);

  --color-green-150-86-44: hsl(150, 86%, 44%);

  --color-red-360-100-40: hsl(360, 100%, 40%);
  --color-red-360-100-45: hsl(360, 100%, 45%);
  --color-red-360-100-92: hsl(360, 100%, 92%);
  --color-red-360-100-97: hsl(360, 100%, 97%);

  --color-white: hsl(0, 0%, 100%);
  --color-black: hsl(0, 0%, 0%);
  --color-black-opacity-05: hsla(0, 0%, 0%, 5%);
  --color-black-opacity-10: hsla(0, 0%, 0%, 10%);

  --breadcrumbs-font-family: var(--bjs-font-family);
  --breadcrumbs-item-color: var(--color-blue-205-100-50);
  --breadcrumbs-arrow-color: var(--color-black);
  --drilldown-fill-color: var(--color-white);
  --drilldown-background-color: var(--color-blue-205-100-50);
}

.bjs-breadcrumbs {
  position: absolute;
  display: none;
  flex-wrap: wrap;
  align-items: center;
  top: 30px;
  left: 30px;
  padding: 0px;
  margin: 0px;
  font-family: var(--breadcrumbs-font-family);
  font-size: 16px;
  line-height: normal;
}

.bjs-breadcrumbs-shown .bjs-breadcrumbs {
  display: flex;
}

.djs-palette-shown .bjs-breadcrumbs {
  left: 90px;
}

.djs-palette-shown.djs-palette-two-column .bjs-breadcrumbs {
  left: 140px;
}

.bjs-breadcrumbs li {
  display: inline-flex;
  padding-bottom: 5px;
  align-items: center;
}

.bjs-breadcrumbs li a {
  cursor: pointer;
  color: var(--breadcrumbs-item-color);
}

.bjs-breadcrumbs li:last-of-type a {
  color: inherit;
  cursor: default;
}

.bjs-breadcrumbs li:not(:first-child)::before {
  content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" /><path d="M0 0h24v24H0z" fill="none" /></svg>');
  padding: 0 8px;
  color: var(--breadcrumbs-arrow-color);
  height: 1em;
}

.bjs-breadcrumbs .bjs-crumb {
  display: inline-block;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bjs-drilldown {
  width: 20px;
  height: 20px;

  padding: 0px;
  margin-left: -20px;

  cursor: pointer;
  border: none;
  border-radius: 2px;
  outline: none;

  fill: var(--drilldown-fill-color);
  background-color: var(--drilldown-background-color);
}

.bjs-drilldown-empty {
  display: none;
}

.selected .bjs-drilldown-empty {
  display: inherit;
}

[data-popup="align-elements"] .djs-popup-results {
  display: flex;
}

[data-popup="align-elements"] .djs-popup-body [data-group] + [data-group] {
  border-left: 1px solid var(--popup-border-color);
}

[data-popup="align-elements"] [data-group="align"] {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

[data-popup="align-elements"] .djs-popup-body .entry {
  padding: 6px 8px;
}

[data-popup="align-elements"] .djs-popup-body .entry:not(:first-child) {
  margin-top: 0;
}

[data-popup="align-elements"] .djs-popup-entry-icon {
  display: block;
  margin: 0;
  height: 20px;
  width: 20px;
}

/* Kaze — estilos de los componentes. Todo valor sale de tokens.css. */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); background: var(--color-panel); color: var(--color-tinta); -webkit-font-smoothing: antialiased; }
.kz-sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.kz-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.kz-row { display: flex; flex-wrap: wrap; gap: var(--spacing-2); align-items: center; }
.kz-label { margin: 0 0 var(--spacing-2); font-size: 10.5px; line-height: 1.5; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-apagado); }
.kz-t-tinta { color: var(--color-tinta); } .kz-t-bien { color: var(--color-estado-bien); } .kz-t-mal { color: var(--color-estado-mal); } .kz-t-apagado { color: var(--color-apagado); } .kz-t-alerta { color: var(--color-estado-alerta-texto); }
:where(button, a, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--color-foco); outline-offset: 2px; }

/* Boton — primario/secundario/pequeño/destructivo de login, admin y error.tsx; acento del prototipo */
.kz-btn { font: inherit; font-size: 14px; line-height: 20px; font-weight: 600; padding: var(--spacing-2) var(--spacing-3); border-radius: var(--radius-md); border: 1px solid var(--color-borde); background: var(--color-blanco); color: var(--color-tinta); cursor: pointer; }
.kz-btn:hover { background: var(--color-panel); }
.kz-btn:disabled { opacity: .5; cursor: default; }
.kz-btn--primario { background: var(--color-tinta); border-color: var(--color-tinta); color: var(--color-blanco); padding-inline: var(--spacing-4); }
.kz-btn--primario:hover { background: var(--color-tinta); }
.kz-btn--acento { background: var(--color-marca-cta, #d93a00); border-color: var(--color-marca-cta, #d93a00); color: var(--color-blanco); padding-inline: var(--spacing-4); }
.kz-btn--acento:hover, .kz-btn--acento:active { background: var(--color-marca-cta-hover, #b83100); border-color: var(--color-marca-cta-hover, #b83100); }
.kz-btn--acento:disabled { background: var(--color-marca-cta, #d93a00); }
.kz-btn--destructivo { border-color: transparent; background: transparent; color: var(--color-estado-mal); }
.kz-btn--destructivo:hover { background: var(--color-panel); }
.kz-btn--sm { font-size: 12px; line-height: 16px; font-weight: 400; padding: var(--spacing-1) var(--spacing-2); }
.kz-link { font: inherit; font-size: 12px; font-weight: 600; background: none; border: 0; padding: 0; color: var(--color-tinta); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

/* CampoTexto */
.kz-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kz-field__label { font-size: 10.5px; line-height: 1.5; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-apagado); }
.kz-input { font: inherit; font-size: 14px; line-height: 20px; width: 100%; padding: var(--spacing-2) var(--spacing-3); border: 1px solid var(--color-borde); border-radius: var(--radius-md); background: var(--color-blanco); color: var(--color-tinta); }
.kz-input::placeholder { color: var(--color-apagado); }
.kz-input--area { resize: vertical; min-height: 64px; }
.kz-input[aria-invalid="true"] { border-color: var(--color-estado-mal); }
.kz-field__help { margin: 0; font-size: 12px; line-height: 16px; color: var(--color-apagado); }
.kz-field__error { margin: 0; font-size: 12px; line-height: 16px; color: var(--color-estado-mal); }

/* Chips de estado — EstadoChip (estado-chip.tsx), EstadoProceso, decisión de aprobador */
.kz-chip { display: inline-flex; align-items: center; gap: 6px; padding: var(--spacing-1) var(--spacing-2); border: 1px solid; border-radius: var(--radius-md); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.kz-chip__dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; flex: none; }
.kz-chip__dot--apagado { background: var(--color-apagado); }
.kz-chip__dot--borde { background: var(--color-borde); }
.kz-chip--bien { color: var(--color-estado-bien); background: var(--color-estado-bien-fondo); border-color: var(--color-estado-bien-borde); }
.kz-chip--mal { color: var(--color-estado-mal); background: var(--color-estado-mal-fondo); border-color: var(--color-estado-mal-borde); }
.kz-chip--neutro { color: var(--color-apagado); background: var(--color-blanco); border-color: var(--color-borde); }
.kz-chip--alerta { color: var(--color-estado-alerta-texto); background: var(--color-blanco); border-color: var(--color-estado-alerta-borde); }
.kz-chip--alerta .kz-chip__dot { background: var(--color-estado-alerta); }

/* EstadoConfirmacion */
.kz-conf { display: inline-flex; align-items: center; gap: 6px; padding: 3px var(--spacing-2) 3px 3px; border: 1px solid; border-radius: var(--radius-md); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; background: var(--color-blanco); }
.kz-conf__glifo { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 3px; border-radius: var(--radius-sm); font-family: var(--font-display); font-size: 10.5px; font-weight: 700; }
.kz-conf--confirmado { color: var(--color-tinta); border-color: var(--color-borde); border-style: solid; }
.kz-conf--confirmado .kz-conf__glifo { background: var(--color-tinta); color: var(--color-blanco); }
.kz-conf--sugerencia { color: var(--color-sugerencia-ia); border-color: var(--color-sugerencia-ia-borde); border-style: dashed; background: var(--color-sugerencia-ia-fondo); }
.kz-conf--sugerencia .kz-conf__glifo { background: var(--color-sugerencia-ia); color: var(--color-blanco); }
.kz-conf--pregunta { color: var(--color-estado-alerta-texto); border-color: var(--color-estado-alerta); border-style: dotted; border-width: 2px; padding: 2px 7px 2px 2px; }
.kz-conf--pregunta .kz-conf__glifo { background: var(--color-estado-alerta-texto); color: var(--color-blanco); }
.kz-conf--compacto { padding: 2px; border-width: 1px; }
.kz-conf--pregunta.kz-conf--compacto { border-width: 2px; padding: 1px; }
.kz-conf--revisar { color: var(--color-estado-alerta-texto); border-color: var(--color-estado-alerta); border-style: dotted; border-width: 2px; padding: 2px 7px 2px 2px; }
.kz-conf--revisar .kz-conf__glifo { background: var(--color-estado-alerta-texto); color: var(--color-blanco); }
.kz-conf--revisar.kz-conf--compacto { border-width: 2px; padding: 1px; }

/* EtiquetaVersion */
.kz-version { display: inline-flex; align-items: center; gap: var(--spacing-2); padding: var(--spacing-1) var(--spacing-2); border-radius: var(--radius-md); font-family: var(--font-display); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.kz-version--asis { background: var(--color-tinta); color: var(--color-blanco); border: 1px solid var(--color-tinta); }
.kz-version--tobe { background: var(--color-blanco); color: var(--color-tinta); border: 1px dashed var(--color-tinta); }
.kz-version__n { font-variant-numeric: tabular-nums; opacity: .8; font-weight: 500; }

/* ValorCampo */
.kz-valor { font-size: inherit; }
.kz-valor--num { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-tinta); }
.kz-valor__u { margin-left: 3px; font-family: var(--font-sans); font-weight: 600; font-size: .85em; color: var(--color-apagado); }
.kz-valor--desconocido { font-family: var(--font-display); font-weight: 700; color: var(--color-estado-alerta-texto); text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
.kz-valor--na { font-size: .85em; font-weight: 600; letter-spacing: .03em; color: var(--color-apagado); }
.kz-valor--vacio { color: var(--color-apagado); }

/* IndicadorGuardado */
.kz-save { display: inline-flex; align-items: center; gap: var(--spacing-2); font-size: 12px; line-height: 16px; color: var(--color-apagado); }
.kz-save__dot { width: 6px; height: 6px; border-radius: var(--radius-full); flex: none; }
.kz-save__dot--ok { background: var(--color-estado-bien); }
.kz-save__dot--busy { background: var(--color-apagado); }
.kz-save__dot--cola { background: var(--color-estado-alerta); }
.kz-save__dot--error { background: var(--color-estado-mal); }
.kz-save__txt { color: var(--color-apagado); }

/* A3Progress, Sparkline, TeamAvatars */
.kz-a3 { width: 140px; }
.kz-a3__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.kz-a3__n { font-family: var(--font-display); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kz-a3__t { font-weight: 500; color: var(--color-apagado); }
.kz-a3__lbl { font-size: 10.5px; color: var(--color-apagado); }
.kz-a3__bar { display: flex; gap: 3px; }
.kz-a3__seg { height: 5px; flex: 1; border-radius: var(--radius-sm); background: var(--color-borde); }
.kz-a3__seg--on { background: var(--color-tinta); }
.kz-spark { display: block; width: 88px; height: 26px; flex: none; }
.kz-team { display: flex; align-items: center; }
.kz-team__a { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: var(--radius-full); border: 2px solid var(--color-blanco); background: var(--color-tinta); color: var(--color-marca); font-family: var(--font-display); font-size: 9.5px; font-weight: 700; }

/* SummaryStrip */
.kz-summary { display: grid; overflow: hidden; border: 1px solid var(--color-borde); border-radius: var(--radius-lg); background: var(--color-blanco); }
.kz-summary__cell { padding: var(--spacing-3) var(--spacing-4); border-right: 1px solid var(--color-borde); }
.kz-summary__cell:last-child { border-right: 0; }
.kz-summary__val { font-family: var(--font-display); font-size: 24px; line-height: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kz-summary__sub { margin-top: 2px; font-size: 11.5px; line-height: 1.5; color: var(--color-apagado); }

/* Marca y Sidebar (sidebar.tsx, sidebar-nav.tsx, account-menu.tsx) */
.kz-mark { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-md); background: var(--color-lateral-hover); flex: none; }
.kz-mark__ring { box-sizing: border-box; border-radius: var(--radius-full); border-style: solid; border-color: var(--color-marca); }
.kz-side { display: flex; flex-direction: column; width: 222px; height: 100%; padding: var(--spacing-4) 0; background: var(--color-tinta); color: rgba(255, 255, 255, .9); }
.kz-side__brand { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid var(--color-lateral-activo); }
.kz-side__name { font-family: var(--font-display); font-size: 16px; font-weight: 700; letter-spacing: -.025em; color: var(--color-blanco); }
.kz-side__sec { padding: var(--spacing-4) 20px var(--spacing-2); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-lateral-tenue); }
.kz-side__sec--gap { padding-top: var(--spacing-6); }
.kz-side__nav, .kz-side__clients { display: flex; flex-direction: column; gap: 1px; padding: 0 var(--spacing-2); }
.kz-side__item { display: flex; align-items: center; gap: 10px; padding: var(--spacing-2) var(--spacing-3); border-radius: var(--radius-md); font-size: 13px; line-height: 1.5; color: var(--color-lateral-texto); text-decoration: none; }
.kz-side__item:hover { background: var(--color-lateral-hover); }
.kz-side__item--on { background: var(--color-lateral-activo); color: var(--color-blanco); font-weight: 600; }
.kz-side__item--on:hover { background: var(--color-lateral-activo); }
.kz-side__item--off { color: var(--color-lateral-tenue); cursor: default; }
.kz-side__item--off:hover { background: transparent; }
.kz-side__bar { width: 4px; height: 14px; border-radius: var(--radius-sm); background: transparent; flex: none; }
.kz-side__item--on .kz-side__bar { background: var(--color-marca); }
.kz-side__client { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-2); padding: 6px var(--spacing-3); font-size: 12.5px; color: var(--color-lateral-texto); }
.kz-side__count { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--color-lateral-tenue); }
.kz-side__foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: var(--spacing-3) var(--spacing-3) 0 var(--spacing-4); border-top: 1px solid var(--color-lateral-activo); }
.kz-side__avatar { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: var(--radius-full); background: var(--color-lateral-activo); color: var(--color-marca); font-family: var(--font-display); font-size: 11px; font-weight: 700; }
.kz-side__who { display: flex; flex-direction: column; min-width: 0; }
.kz-side__uname { font-size: 12px; font-weight: 600; color: var(--color-blanco); }
.kz-side__role { font-size: 10.5px; text-transform: capitalize; color: var(--color-lateral-tenue); }

/* CabeceraPagina (proyectos/page.tsx) */
.kz-head { background: var(--color-blanco); border-bottom: 1px solid var(--color-borde); padding: var(--spacing-5) var(--spacing-7) var(--spacing-4); }
.kz-head__row { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-4); flex-wrap: wrap; }
.kz-head__top { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-3); margin-bottom: 2px; min-width: 0; }
.kz-head__crumbs { display: flex; flex-wrap: wrap; gap: 0 6px; min-width: 0; font-size: 11.5px; line-height: 1.5; color: var(--color-apagado); }
.kz-head__estado { flex: none; }
.kz-head__title { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.5; font-weight: 700; letter-spacing: -.025em; }
.kz-head__sub { margin: 2px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--color-apagado); }
.kz-head__actions { display: flex; align-items: center; gap: var(--spacing-2); flex-wrap: wrap; }

/* PanelDetalle */
.kz-panel { display: flex; flex-direction: column; width: 380px; max-height: 100%; background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
.kz-panel__head { padding: var(--spacing-4) var(--spacing-5) var(--spacing-3); border-bottom: 1px solid var(--color-borde); }
.kz-panel__meta { display: flex; align-items: center; gap: var(--spacing-2); margin-bottom: 6px; }
.kz-panel__code { font-family: var(--font-display); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-apagado); }
.kz-panel__titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-2); }
.kz-panel__title { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 28px; font-weight: 700; }
.kz-icon-btn { font: inherit; font-size: 18px; line-height: 1; width: 28px; height: 28px; border: 1px solid var(--color-borde); border-radius: var(--radius-md); background: var(--color-blanco); color: var(--color-tinta); cursor: pointer; flex: none; }
.kz-icon-btn:hover { background: var(--color-panel); }
.kz-panel__body { overflow: auto; padding: var(--spacing-4) var(--spacing-5); display: flex; flex-direction: column; gap: var(--spacing-4); }
.kz-panel__sec + .kz-panel__sec { border-top: 1px solid var(--color-borde); padding-top: var(--spacing-4); }
.kz-dl { display: grid; grid-template-columns: 132px 1fr; gap: 6px var(--spacing-3); margin: 0; font-size: 13px; line-height: 20px; }
.kz-dl dt { color: var(--color-apagado); }
.kz-dl dd { margin: 0; min-width: 0; }
.kz-panel__foot { display: flex; gap: var(--spacing-2); padding: var(--spacing-3) var(--spacing-5); border-top: 1px solid var(--color-borde); background: var(--color-blanco); }

/* TablaActividades */
.kz-grid-wrap { position: relative; overflow-x: auto; background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); }
.kz-grid { width: 100%; min-width: 880px; border-collapse: collapse; font-size: 13px; line-height: 20px; }
.kz-grid th { position: sticky; top: 0; background: var(--color-blanco); text-align: left; padding: var(--spacing-2) var(--spacing-3); border-bottom: 1px solid var(--color-borde); font-size: 10.5px; line-height: 1.5; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-apagado); white-space: nowrap; }
.kz-grid td { height: 36px; padding: 0 var(--spacing-3); border-bottom: 1px solid var(--color-borde); border-right: 1px solid var(--color-borde); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.kz-grid td:last-child { border-right: 0; }
.kz-grid tbody tr { cursor: default; }
.kz-grid tbody tr:hover td { background: var(--color-panel); }
.kz-grid__id { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-apagado); width: 56px; }
.kz-grid__name { font-weight: 600; }
.kz-grid__num { text-align: right; }
.kz-grid__none { color: var(--color-apagado); font-style: italic; }
.kz-grid__row--ia td { background: var(--color-sugerencia-ia-fondo); border-bottom-style: dashed; border-bottom-color: var(--color-sugerencia-ia-borde); }
.kz-grid__row--sel td { box-shadow: inset 0 2px 0 var(--color-marca), inset 0 -2px 0 var(--color-marca); }
.kz-grid__row--sel td:first-child { box-shadow: inset 2px 2px 0 var(--color-marca), inset 0 -2px 0 var(--color-marca); }
.kz-grid__row--sel td:last-child { box-shadow: inset -2px 2px 0 var(--color-marca), inset 0 -2px 0 var(--color-marca); }
.kz-grid__new td { color: var(--color-apagado); border-bottom: 0; }

/* TarjetaActividad y ColumnaFase */
.kz-card { background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); padding: var(--spacing-3); display: flex; flex-direction: column; gap: 4px; }
.kz-card--ia { background: var(--color-sugerencia-ia-fondo); border-style: dashed; border-color: var(--color-sugerencia-ia-borde); }
.kz-card--q { border-style: dotted; border-width: 2px; border-color: var(--color-estado-alerta); padding: 11px; }
.kz-card--drag { box-shadow: var(--shadow-lg); transform: rotate(-1.5deg); }
.kz-card__top { display: flex; align-items: center; gap: 6px; }
.kz-card__top .kz-conf { margin-left: auto; }
.kz-card__top .kz-card__abrir + .kz-conf { margin-left: 6px; }
.kz-card__id { font-family: var(--font-display); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-apagado); padding: 0 2px; border-radius: var(--radius-sm); }
.kz-card__id--sin { font-family: var(--font-sans); font-style: italic; font-weight: 400; }
.kz-card__id--nuevo { animation: kz-renum 1.4s ease-out; color: var(--color-tinta); }
@keyframes kz-renum { 0%, 35% { box-shadow: 0 0 0 2px var(--color-marca); } 100% { box-shadow: 0 0 0 2px transparent; } }
.kz-card__name { font-family: var(--font-display); font-size: 14px; line-height: 20px; font-weight: 600; }
.kz-card__meta { font-size: 11.5px; line-height: 1.5; color: var(--color-apagado); }
.kz-card__out { font-size: 11.5px; line-height: 1.5; color: var(--color-tinta); }
.kz-phase { display: flex; flex-direction: column; gap: var(--spacing-2); width: var(--kz-fase-ancho, 264px); flex: none; }
.kz-phase__head { background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); padding: var(--spacing-3); }
.kz-phase__title { display: flex; align-items: center; gap: var(--spacing-2); font-family: var(--font-display); font-size: 14px; line-height: 20px; font-weight: 700; }
.kz-phase__n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: var(--radius-sm); background: var(--color-tinta); color: var(--color-blanco); font-size: 11px; font-variant-numeric: tabular-nums; }
.kz-phase__count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--color-apagado); font-variant-numeric: tabular-nums; }
.kz-phase__obj { margin: 6px 0 0; font-size: 12px; line-height: 16px; color: var(--color-apagado); }
.kz-phase__crit { display: grid; grid-template-columns: 76px 1fr; gap: 4px var(--spacing-2); margin: var(--spacing-2) 0 0; padding-top: var(--spacing-2); border-top: 1px solid var(--color-borde); font-size: 11.5px; line-height: 1.5; }
.kz-phase__crit dt { color: var(--color-apagado); }
.kz-phase__crit dd { margin: 0; }
.kz-phase__cards { display: flex; flex-direction: column; gap: var(--spacing-2); min-height: 56px; }
.kz-phase__empty { padding: var(--spacing-3); border: 1px dashed var(--color-borde); border-radius: var(--radius-lg); background: var(--color-blanco); font-size: 12px; line-height: 16px; text-align: center; color: var(--color-apagado); }
.kz-phase--destino .kz-phase__head { border-color: var(--color-marca); }

/* TableroFases compacto: listar y agrupar antes de caracterizar */
.kz-board--compacto { --kz-fase-ancho: 224px; }
.kz-card--compacto { padding: 8px 10px; gap: 2px; }
.kz-card--compacto.kz-card--q { padding: 7px 9px; }
.kz-card--compacto .kz-card__name { font-size: 13.5px; line-height: 19px; }
.kz-card__name--editable { cursor: text; }
.kz-card__name--editable:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
.kz-card__input { font: inherit; font-family: var(--font-display); font-size: 13.5px; line-height: 19px; font-weight: 600; width: 100%; padding: 2px 4px; border: 1px solid var(--color-tinta); border-radius: var(--radius-sm); background: var(--color-blanco); color: var(--color-tinta); }
.kz-card__abrir { font: inherit; font-size: 11px; line-height: 16px; font-weight: 600; margin-left: auto; padding: 1px 6px; border: 1px solid var(--color-borde); border-radius: var(--radius-sm); background: var(--color-blanco); color: var(--color-tinta); cursor: pointer; opacity: 0; }
.kz-card:hover .kz-card__abrir, .kz-card:focus .kz-card__abrir, .kz-card:focus-within .kz-card__abrir { opacity: 1; }
@media (hover: none) { .kz-card__abrir { opacity: 1; } }
.kz-alta { font: inherit; font-size: 13px; line-height: 20px; width: 100%; padding: 7px 10px; border: 1px dashed var(--color-apagado); border-radius: var(--radius-lg); background: var(--color-blanco); color: var(--color-tinta); }
.kz-alta::placeholder { color: var(--color-apagado); }
.kz-alta:focus { border-style: solid; border-color: var(--color-tinta); }
.kz-phase__nom { font: inherit; font-family: var(--font-display); font-size: 14px; line-height: 20px; font-weight: 700; padding: 0; border: 0; background: none; color: var(--color-tinta); cursor: text; text-align: left; min-width: 0; }
.kz-phase__nom:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
.kz-phase__input { font: inherit; font-family: var(--font-display); font-size: 14px; line-height: 20px; font-weight: 700; flex: 1; min-width: 0; padding: 1px 4px; border: 1px solid var(--color-tinta); border-radius: var(--radius-sm); background: var(--color-blanco); color: var(--color-tinta); }
.kz-phase__edit { display: inline-block; margin-top: 6px; font-size: 11.5px; line-height: 16px; font-weight: 600; text-align: left; }
.kz-phase__faltan { color: var(--color-apagado); font-weight: 400; text-decoration: none; display: inline-block; white-space: pre; }
.kz-phase--compacta .kz-phase__head { padding: 10px var(--spacing-3); }
.kz-phase-nueva { flex: none; align-self: flex-start; width: 168px; min-height: 44px; padding: 10px var(--spacing-3); border: 1px dashed var(--color-apagado); border-radius: var(--radius-lg); background: transparent; font: inherit; font-size: 13px; font-weight: 600; text-align: left; color: var(--color-tinta); cursor: pointer; }
.kz-phase-nueva:hover { background: var(--color-blanco); }
.kz-phase-nueva--abierta { display: flex; flex-direction: column; gap: 6px; width: var(--kz-fase-ancho, 264px); background: var(--color-blanco); cursor: default; }
.kz-board--lectura .kz-card { cursor: pointer; }
.kz-phase-nueva__ayuda { margin: 0; font-size: 11.5px; line-height: 1.4; font-weight: 400; color: var(--color-apagado); }

/* TableroFases — arrastre entre fases */
.kz-board { position: relative; display: flex; gap: var(--spacing-4); align-items: flex-start; overflow-x: auto; padding-bottom: var(--spacing-2); }
.kz-board--drag, .kz-board--drag * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.kz-card--arrastrable { cursor: grab; user-select: none; -webkit-user-select: none; }
.kz-card--arrastrable:not(.kz-card--ia):not(.kz-card--q):hover { border-color: var(--color-apagado); }
.kz-card--origen { opacity: .35; }
.kz-card--sel { box-shadow: 0 0 0 2px var(--color-marca); }
.kz-grip { width: 9px; height: 14px; flex: none; margin-left: -2px; touch-action: none; cursor: grab; background-image: radial-gradient(circle, var(--color-apagado) 1.3px, transparent 1.6px); background-size: 4.5px 4.67px; }
.kz-drop { height: 3px; margin: -5.5px 0; border-radius: var(--radius-full); background: var(--color-marca); flex: none; }
.kz-ghost { position: fixed; z-index: 1000; pointer-events: none; opacity: .92; }
.kz-ghost .kz-card { box-shadow: var(--shadow-lg); }
@media (prefers-reduced-motion: reduce) { .kz-card__id--nuevo { animation: none; box-shadow: 0 0 0 2px var(--color-marca); } .kz-card--drag { transform: none; } }
.kz-phase--none .kz-phase__head { background: transparent; border-style: dashed; }

/* TarjetaDecision */
.kz-dec { background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); padding: var(--spacing-4); display: flex; flex-direction: column; gap: var(--spacing-3); }
.kz-dec--ia { background: var(--color-sugerencia-ia-fondo); border-style: dashed; border-color: var(--color-sugerencia-ia-borde); }
.kz-dec--revisar { border: 2px dotted var(--color-estado-alerta); padding: 15px; }
.kz-dec__rev { display: flex; flex-direction: column; gap: var(--spacing-2); padding: var(--spacing-3); border-radius: var(--radius-md); background: var(--color-panel); }
.kz-dec__rev-t { font-family: var(--font-display); font-size: 13px; line-height: 20px; font-weight: 700; color: var(--color-tinta); }
.kz-dec__rev-l { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.5; color: var(--color-tinta); }
.kz-dec__cod { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 600; }
.kz-dec__fin { font-style: italic; }
.kz-dec__roto { color: var(--color-estado-mal); font-weight: 600; }
.kz-dec__out--revisar { border: 2px dotted var(--color-estado-alerta); padding: 7px 11px; }
.kz-dec__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-3); }
.kz-dec__q { font-family: var(--font-display); font-size: 16px; line-height: 22px; font-weight: 600; }
.kz-dec__meta { display: grid; grid-template-columns: 64px 1fr; gap: 4px var(--spacing-3); margin: 0; font-size: 12.5px; line-height: 1.5; }
.kz-dec__meta dt { color: var(--color-apagado); }
.kz-dec__meta dd { margin: 0; }
.kz-dec__type { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; vertical-align: middle; }
.kz-dec__bpmn { color: var(--color-apagado); }
.kz-dec__outs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.kz-dec__out { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spacing-2); padding: var(--spacing-2) var(--spacing-3); border: 1px solid var(--color-borde); border-radius: var(--radius-md); background: var(--color-blanco); font-size: 13px; line-height: 20px; }
.kz-dec__cond { font-weight: 600; }
.kz-dec__arrow { color: var(--color-apagado); }
.kz-tag { display: inline-block; padding: 0 6px; border: 1px solid var(--color-borde); border-radius: var(--radius-sm); font-size: 11px; line-height: 18px; font-weight: 600; color: var(--color-apagado); background: var(--color-blanco); }
.kz-tag--retrabajo, .kz-tag--excepcion { color: var(--color-estado-alerta-texto); border-color: var(--color-estado-alerta-borde); }
.kz-tag--rechazo, .kz-tag--cancelacion { color: var(--color-estado-mal); border-color: var(--color-estado-mal-borde); }

/* PanelAprobacion */
.kz-appr { background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); overflow: hidden; }
.kz-appr__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-3); padding: var(--spacing-4) var(--spacing-5); border-bottom: 1px solid var(--color-borde); }
.kz-appr__title { margin: 0; font-family: var(--font-display); font-size: 16px; line-height: 22px; font-weight: 700; }
.kz-appr__ver { margin-top: 2px; font-size: 11.5px; line-height: 1.5; color: var(--color-apagado); }
.kz-appr__list { list-style: none; margin: 0; padding: 0; }
.kz-appr__item { display: flex; align-items: flex-start; gap: var(--spacing-3); padding: var(--spacing-3) var(--spacing-5); border-bottom: 1px solid var(--color-borde); }
.kz-appr__av { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: var(--radius-full); background: var(--color-tinta); color: var(--color-marca); font-family: var(--font-display); font-size: 11px; font-weight: 700; flex: none; }
.kz-appr__who { flex: 1; min-width: 0; }
.kz-appr__name { font-size: 13px; line-height: 20px; font-weight: 600; }
.kz-appr__role { font-size: 11.5px; line-height: 1.5; color: var(--color-apagado); }
.kz-appr__comment { margin: 6px 0 0; padding: 6px 10px; border-left: 0; border-radius: var(--radius-md); background: var(--color-panel); font-size: 12.5px; line-height: 1.5; color: var(--color-tinta); }
.kz-appr__act { display: flex; flex-direction: column; gap: var(--spacing-3); padding: var(--spacing-4) var(--spacing-5); }

/* ElementoBPMN */
.kz-bpmn { display: inline-block; vertical-align: middle; overflow: visible; }
.kz-bpmn__txt { font-family: var(--font-sans); font-size: 12px; fill: var(--color-tinta); }
.kz-icono { display: inline-block; flex: none; vertical-align: -3px; overflow: visible; }

/* Utilidades de las vistas previas */
.kz-demo { padding: var(--spacing-4); display: flex; flex-wrap: wrap; gap: var(--spacing-3); align-items: center; }
.kz-demo--col { flex-direction: column; align-items: stretch; }
.kz-demo--white { background: var(--color-blanco); }

/* Estado destacado (cabecera): rótulo + píldora, para no confundirse con un botón */
.kz-estado { display: inline-flex; align-items: center; gap: var(--spacing-2); }
.kz-estado__rot { font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--color-apagado); }
.kz-chip--estado { border-radius: var(--radius-full); padding: 4px 12px; font-size: 13px; line-height: 18px; font-weight: 700; }
.kz-chip--estado .kz-chip__dot { width: 8px; height: 8px; }
.kz-chip--estado.kz-chip--neutro { background: var(--color-panel); color: var(--color-tinta); border-color: var(--color-borde); }
.kz-chip--estado.kz-chip--neutro .kz-chip__dot { background: var(--color-blanco); box-shadow: inset 0 0 0 1.5px var(--color-apagado); }

/* Botón de solo ícono con su palabra al pasar el mouse */
.kz-ibtn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0; border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--color-tinta); cursor: pointer; }
.kz-ibtn:hover { background: var(--color-panel); }
.kz-ibtn:focus-visible { outline: 2px solid var(--color-foco); outline-offset: 2px; }
.kz-ibtn:disabled { color: var(--color-apagado); cursor: default; background: transparent; }
.kz-ibtn .kz-icono { vertical-align: 0; }
.kz-ibtn::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 40; padding: 4px 8px; border-radius: var(--radius-sm); background: var(--color-tinta); color: var(--color-blanco); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s ease .15s; }
.kz-ibtn:hover::after, .kz-ibtn:focus-visible::after { opacity: 1; }
@media (hover: none) { .kz-ibtn::after { display: none; } }

/* Lista desplegable de versiones */
.kz-versel { position: relative; display: inline-flex; }
.kz-versel__btn { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border: 1px solid var(--color-borde); border-radius: var(--radius-md); background: var(--color-blanco); color: var(--color-tinta); font: inherit; cursor: pointer; }
.kz-versel__btn:hover { background: var(--color-panel); }
.kz-versel__btn:focus-visible { outline: 2px solid var(--color-foco); outline-offset: 2px; }
.kz-versel__btn[aria-expanded="true"] .kz-versel__chev { transform: rotate(180deg); }
.kz-versel__menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; min-width: 260px; margin: 0; padding: 4px; list-style: none; background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); }
.kz-versel__op { display: flex; align-items: center; gap: var(--spacing-2); padding: 7px 8px; border-radius: var(--radius-sm); font-size: 13px; line-height: 18px; cursor: pointer; }
.kz-versel__op:hover, .kz-versel__op:focus { background: var(--color-panel); outline: none; }
.kz-versel__op:focus-visible { box-shadow: inset 0 0 0 2px var(--color-foco); }
.kz-versel__ok { margin-left: auto; font-weight: 700; }
.kz-versel__op--crear { border-top: 1px solid var(--color-borde); border-radius: 0 0 var(--radius-sm) var(--radius-sm); margin-top: 4px; padding-top: 9px; font-weight: 600; }

/* Aprobación por etapas */
.kz-appr__etapa { border-bottom: 1px solid var(--color-borde); }
.kz-appr__etapa:last-of-type { border-bottom: 0; }
.kz-appr__etapa-cab { display: flex; align-items: center; gap: var(--spacing-2); padding: var(--spacing-3) var(--spacing-5) var(--spacing-1); }
.kz-appr__etapa-n { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--color-tinta); color: var(--color-blanco); font-size: 11px; font-weight: 700; flex: none; }
.kz-appr__etapa-t { font-size: 13px; line-height: 20px; font-weight: 700; }
.kz-appr__etapa-e { margin-left: auto; font-size: 11.5px; line-height: 16px; font-weight: 600; color: var(--color-apagado); }
.kz-appr__etapa--espera .kz-appr__etapa-n { background: var(--color-blanco); color: var(--color-apagado); box-shadow: inset 0 0 0 1.5px var(--color-borde); }
.kz-appr__etapa--espera .kz-appr__item { opacity: .75; }
.kz-appr__etapa--completa .kz-appr__etapa-e { color: var(--color-estado-bien); }
.kz-appr__etapa--cambios .kz-appr__etapa-e { color: var(--color-estado-mal); }
.kz-appr__etapa-nota { margin: 0; padding: 0 var(--spacing-5) var(--spacing-2) calc(var(--spacing-5) + 28px); font-size: 12px; line-height: 1.5; color: var(--color-apagado); }
.kz-appr__etapa .kz-appr__item:last-child { border-bottom: 0; }
.kz-appr__det { margin-top: 2px; font-size: 12px; line-height: 1.5; color: var(--color-tinta); overflow-wrap: anywhere; }
.kz-appr__acc { display: flex; flex-wrap: wrap; gap: var(--spacing-2); margin-top: var(--spacing-2); }
.kz-appr__pie { padding: var(--spacing-4) var(--spacing-5); border-top: 1px solid var(--color-borde); background: var(--color-blanco); }
@media (max-width: 560px) {
  .kz-appr__head, .kz-appr__etapa-cab, .kz-appr__item, .kz-appr__act, .kz-appr__pie { padding-left: var(--spacing-4); padding-right: var(--spacing-4); }
  .kz-appr__etapa-nota { padding-left: calc(var(--spacing-4) + 28px); padding-right: var(--spacing-4); }
  .kz-appr__item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: var(--spacing-2) var(--spacing-3); }
  .kz-appr__item > .kz-chip { grid-column: 2; justify-self: start; }
}

/* Prototipo de captura — estilos propios, siempre con tokens de Kaze. */
html, body { height: 100%; }
body { background: var(--color-panel); color: var(--color-tinta); font-family: var(--font-sans); font-size: 14px; }
#app { height: 100%; }
.app { display: flex; height: 100%; min-height: 0; }
.app > .kz-side { position: sticky; top: 0; height: 100%; flex: none; }
.principal { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
.pagina { display: flex; flex-direction: column; min-height: 100%; }
.contenido { display: flex; flex-direction: column; gap: var(--spacing-4); padding: var(--spacing-5) var(--spacing-7) 64px; }
.kz-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-bottom: 0; }
.kz-head__actions { align-items: center; }
.miga { font: inherit; background: none; border: 0; padding: 0; color: var(--color-apagado); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.miga-act { color: var(--color-tinta); font-weight: 600; }

/* Pestañas */
.tabs { display: flex; gap: 2px; margin-top: var(--spacing-3); overflow-x: auto; scrollbar-width: thin; }
.tab { font: inherit; font-size: 13px; line-height: 20px; padding: var(--spacing-2) var(--spacing-3) 10px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--color-apagado); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--color-tinta); }
.tab[aria-selected="true"] { color: var(--color-tinta); font-weight: 600; border-bottom-color: var(--color-marca); }
.tab__n { font-family: var(--font-display); font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 5px; border-radius: var(--radius-sm); background: var(--color-panel); color: var(--color-tinta); }
.tab__alerta { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: var(--radius-sm); background: var(--color-estado-alerta-texto); color: var(--color-blanco); font-family: var(--font-display); font-size: 11px; font-weight: 700; }

/* Versiones y guardado */
.versiones { display: inline-flex; gap: 4px; align-items: center; }
.version-b { font: inherit; padding: 2px; border: 2px solid transparent; border-radius: 8px; background: none; cursor: pointer; }
.version-b[aria-pressed="true"] { border-color: var(--color-marca); }
.guardado-wrap { position: relative; }
.historial { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(380px, 90vw); background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: var(--spacing-3); display: flex; flex-direction: column; gap: var(--spacing-2); }
.historial__cab { display: flex; justify-content: space-between; align-items: center; }
.historial__l { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; display: flex; flex-direction: column; }
.historial__l li { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--spacing-2); padding: 6px 0; border-bottom: 1px solid var(--color-borde); font-size: 12.5px; }
.historial__l li .kz-link { grid-column: 1 / -1; justify-self: start; }
.historial__t { color: var(--color-apagado); font-size: 11.5px; }

/* Bloques */

.celda-num { display: inline-flex; align-items: center; gap: 2px; }

.celda-id, .celda-estado { font: inherit; background: none; border: 0; padding: 4px 2px; cursor: pointer; color: inherit; }

.alta { display: flex; align-items: center; gap: var(--spacing-3); }

.lf__l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lf__i { position: relative; font: inherit; width: 100%; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 2px 6px; padding: 7px 8px 7px 12px; border: 1px solid transparent; border-radius: var(--radius-md); background: var(--color-blanco); color: var(--color-tinta); text-align: left; cursor: pointer; }

.ficha { background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); display: flex; flex-direction: column; min-width: 0; }
.ficha__cab { display: flex; flex-direction: column; gap: var(--spacing-2); padding: var(--spacing-4) var(--spacing-5); border-bottom: 1px solid var(--color-borde); }
.ficha__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; line-height: 20px; color: var(--color-apagado); }

.ev__acc { grid-column: 2; gap: 10px; }
.ev__ed { display: flex; flex-direction: column; gap: var(--spacing-3); padding: 0 10px 10px; }
.ev__dur { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--spacing-2); }
.evs__menu { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.evs__op { font: inherit; font-size: 12.5px; line-height: 18px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid var(--color-borde); border-radius: var(--radius-md); background: var(--color-blanco); color: var(--color-tinta); cursor: pointer; text-align: left; }
.evs__op:hover { border-color: var(--color-tinta); }
.ciclo { padding-top: var(--spacing-2); }
.dec-ficha { display: flex; flex-direction: column; gap: var(--spacing-3); }
.dec-vacia { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--spacing-2) var(--spacing-3); }
.dec-vacia .nota { flex: 1 1 280px; }
.editor-dec { display: flex; flex-direction: column; gap: var(--spacing-3); padding: var(--spacing-4); border: 2px solid var(--color-tinta); border-radius: var(--radius-lg); background: var(--color-blanco); }
.lf__i--dec .lf__cod { color: var(--color-tinta); }
.refs__cod { width: 130px; }
.refs td .kz-input { padding-block: 6px; }

/* Fases: criterios */
.fases-ed { display: flex; flex-direction: column; gap: var(--spacing-3); }
.editor-fases__f--foco { border-color: var(--color-tinta); }
.editor-fases__acts { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; line-height: 1.5; }
.editor-fases__acts b { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; color: var(--color-apagado); }

/* Fases */
.editor-fases { display: flex; flex-direction: column; gap: var(--spacing-3); }
.editor-fases__f { background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); padding: var(--spacing-3) var(--spacing-4); display: flex; flex-direction: column; gap: var(--spacing-3); }
.editor-fases__cab { display: flex; align-items: center; gap: var(--spacing-2); }
.editor-fases__nom { flex: 1; font-family: var(--font-display); font-weight: 700; }
.tablero { overflow: hidden; }

/* Decisiones */
.decisiones { display: flex; flex-direction: column; gap: var(--spacing-4); max-width: 820px; }
.dec-item { display: flex; flex-direction: column; gap: var(--spacing-2); }
.editor-dec { border: 2px solid var(--color-tinta); }
.tipo-dec { display: flex; flex-direction: column; gap: 4px; }
.salidas td { min-width: 120px; }

/* Diagrama */
.diagrama { display: flex; flex-direction: column; gap: var(--spacing-3); }
.lienzo-wrap { position: relative; height: min(68vh, 640px); min-height: 360px; background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-lg); overflow: hidden; }
.lienzo { position: absolute; inset: 0; }
.lienzo__vacio { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--spacing-6); text-align: center; color: var(--color-apagado); background: var(--color-blanco); font-size: 13px; }
.lienzo__zoom { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
.leyenda { display: flex; flex-wrap: wrap; gap: var(--spacing-2) var(--spacing-4); font-size: 12px; color: var(--color-tinta); align-items: center; }
.leyenda__r { margin-left: auto; color: var(--color-apagado); }
.ley { display: inline-block; width: 18px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 2px solid var(--color-tinta); }
.ley--ia { border: 2px dashed var(--color-sugerencia-ia); }
.ley--q { border: 2px dotted var(--color-estado-alerta); }
.ley--h { border: 2px solid var(--color-estado-mal); }
.xml { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
.kz-m-sugerencia .djs-visual > rect { stroke: #2458a6 !important; stroke-dasharray: 6 4; }
.kz-m-pregunta .djs-visual > rect { stroke: #b8860b !important; stroke-dasharray: 2 3; stroke-width: 3px !important; }
.kz-m-huerfana .djs-visual > rect { stroke: #c0392b !important; }
.djs-container .djs-outline, .djs-container .djs-selection-outline { stroke: #f94202 !important; }
.bjs-powered-by { opacity: .7; }
.lienzo .djs-palette { top: 12px; left: 12px; border-radius: var(--radius-md); border-color: var(--color-borde); background: var(--color-blanco); box-shadow: var(--shadow-sm); }
.lienzo .djs-palette .entry { color: var(--color-tinta); }
.lienzo .djs-palette .entry:hover { color: var(--color-marca); }
.lienzo-wrap--lectura .djs-palette { display: none; }
.lienzo .djs-context-pad .entry { background-color: var(--color-blanco); }
.lienzo .djs-context-pad .kz-cp-ficha { width: auto; min-width: 40px; height: 22px; padding: 0 6px; font-family: var(--font-sans); font-size: 11px; line-height: 22px; font-weight: 700; color: var(--color-tinta); border: 1px solid var(--color-borde); border-radius: var(--radius-sm); }
.lienzo .djs-direct-editing-parent { font-family: var(--font-sans) !important; }
.leyenda .kz-icono { margin-right: 4px; }

/* Aprobación */
.aprobacion { display: flex; flex-direction: column; gap: var(--spacing-4); max-width: 720px; }
.aprobadores-sel { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

/* Modales e IA */
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(17, 17, 17, 0.45); display: grid; place-items: center; padding: 16px; }
.modal__caja { width: 100%; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--color-blanco); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
.modal__cab { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-4) var(--spacing-5); border-bottom: 1px solid var(--color-borde); }
.modal__t { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 26px; font-weight: 700; }
.modal__cuerpo { padding: var(--spacing-4) var(--spacing-5); overflow: auto; display: flex; flex-direction: column; gap: var(--spacing-3); }
.modal__pie { display: flex; flex-wrap: wrap; gap: var(--spacing-2); padding: var(--spacing-3) var(--spacing-5); border-top: 1px solid var(--color-borde); }
.pensando { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--color-tinta); }
.pensando__punto { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--color-sugerencia-ia); border-top-color: transparent; animation: giro 0.9s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }
.res-ia { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--spacing-2); }
.res-ia__i { padding: var(--spacing-3); border: 1px dashed var(--color-sugerencia-ia-borde); background: var(--color-sugerencia-ia-fondo); border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 6px; }
.res-ia__campos { display: flex; flex-wrap: wrap; gap: 4px; }
.res-ia__ev { font-size: 12px; font-style: italic; color: var(--color-tinta); }
.res-ia__dec { display: flex; flex-direction: column; gap: 6px; }

/* Exportar documento */
.doc-cuenta { margin: 0; font-size: 12.5px; color: var(--color-apagado); }
.doc-op { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.doc-op__rot { font-size: 13px; font-weight: 600; }
.doc-check { align-items: flex-start; }
.doc-check input { margin-top: 2px; }
.doc-check .campo__ayuda { display: block; margin-top: 2px; }
.doc-notas { display: flex; flex-direction: column; gap: 6px; padding: var(--spacing-3); background: var(--color-panel); border-radius: var(--radius-md); }
.doc-notas .kz-label { margin: 0; }
.doc-ok { color: var(--color-estado-bien); font-weight: 600; }

@media (prefers-reduced-motion: reduce) { .pensando__punto { animation: none; } }
@media (max-width: 1180px) {
  .ficha__secciones { grid-template-columns: minmax(0, 1fr); }
  .evs { grid-template-columns: minmax(0, 1fr); }
  .dos-col { grid-template-columns: minmax(0, 1fr); }
  .col-lado { position: static; }
}
@media (max-width: 860px) {
  .app > .kz-side { display: none; }
  .contenido { padding: var(--spacing-4) 16px 64px; }
  .kz-head { padding-left: 16px; padding-right: 16px; }
  .rejilla-2, .rejilla-3 { grid-template-columns: minmax(0, 1fr); }
  .kz-head { position: static; }
  .caracterizar { grid-template-columns: minmax(0, 1fr); }
  .lf { display: none; }
  .ficha-nav__sel { display: block; }

  .ficha__cab, .ficha__secciones, .ficha__pie { padding-left: 16px; padding-right: 16px; }

  .paso { padding-right: 10px; }
  .paso__m { display: none; }
}

.etiqueta-ej { margin-left: 8px; vertical-align: 2px; font-family: var(--font-sans); }

/* Revisión del diagrama */
.revd__cuenta { margin-left: 10px; font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--color-apagado); }
.revd__l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.revd__i { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.45; }
.revd__n { flex: none; min-width: 44px; padding: 1px 6px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; text-align: center; }
.revd__i--error .revd__n { background: var(--color-estado-mal-fondo); color: var(--color-estado-mal); border: 1px solid var(--color-estado-mal-borde); }
.revd__i--aviso .revd__n { background: var(--color-blanco); color: var(--color-estado-alerta-texto); border: 1px solid var(--color-estado-alerta-borde); }
.revd__t { font: inherit; text-align: left; padding: 0; border: 0; background: none; color: var(--color-tinta); cursor: pointer; }
button.revd__t:hover { text-decoration: underline; text-underline-offset: 2px; }
.revd__ok { margin: 0; font-size: 13px; color: var(--color-estado-bien); font-weight: 600; }
.revd--compacta { padding: var(--spacing-3); background: var(--color-estado-mal-fondo); border-color: var(--color-estado-mal-borde); }
.diagrama__bloqueo { font-weight: 600; }
.ley--error { border: 2px solid var(--color-estado-mal); }
.djs-element.kz-m-error .djs-visual > :first-child { stroke: var(--color-estado-mal) !important; stroke-width: 3px !important; }
.djs-connection.kz-m-error .djs-visual > path { stroke: var(--color-estado-mal) !important; stroke-width: 3px !important; }
.lienzo:focus { outline: none; }
.lienzo:focus-visible { outline: 2px solid var(--color-foco); outline-offset: -2px; }

/* Seguro de exportación */
.doc-bloqueo { border: 1px solid var(--color-estado-mal-borde); background: var(--color-estado-mal-fondo); border-radius: var(--radius-md); padding: var(--spacing-3) var(--spacing-4); margin: var(--spacing-3) 0; display: grid; gap: var(--spacing-3); justify-items: start; }
.doc-bloqueo__tit { margin: 0; font-size: 14px; line-height: 1.45; color: var(--color-tinta); }
.doc-bloqueo .revd { margin: 0; width: 100%; box-shadow: none; border: 0; padding: 0; background: transparent; }
.doc-bloqueo .revd .tarjeta__t, .doc-bloqueo .revd .nota { display: none; }
.revd-res { margin: 0 0 var(--spacing-3); padding: var(--spacing-2) var(--spacing-3); border-left: 3px solid var(--color-estado-mal); background: var(--color-estado-mal-fondo); border-radius: var(--radius-sm); font-size: 13px; }
.revd-res .avisos__t { text-align: left; }

/* Así se lee en el procedimiento */
.relato { max-width: 76ch; font-size: 14px; line-height: 1.6; color: var(--color-tinta); background: var(--color-blanco); border: 1px solid var(--color-borde);
  border-radius: var(--radius-md); padding: var(--spacing-4) var(--spacing-5); box-shadow: var(--shadow-sm); }
.relato > :last-child { margin-bottom: 0; }
@media (max-width: 640px) { .relato { padding: var(--spacing-3); font-size: 13.5px; } }
.relato p { margin: 0 0 var(--spacing-2); }
.relato__t { font-weight: 700; font-size: 15px; }
.relato__cod { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--color-apagado); letter-spacing: .02em; }
.relato__aviso { padding-left: var(--spacing-3); border-left: 3px solid var(--color-marca); }
.relato__aviso--imp b { color: var(--color-marca); }
.relato__aviso--aten { border-left-color: var(--color-estado-alerta); }
.relato__aviso--aten b { color: var(--color-estado-alerta-texto); }
.relato__ramas { list-style: none; margin: 0 0 var(--spacing-2); padding: 0 0 0 22px; }
.relato__ramas li { position: relative; margin: 0 0 2px; }
.relato__ramas li::before { content: '→'; position: absolute; left: -20px; color: var(--color-marca); }
.relato__falta { color: var(--color-estado-alerta-texto); font-style: italic; }

.relato__nota { font-size: 13px; }

  .lienzo .djs-palette { transform: scale(.7); transform-origin: 0 0; }
  .lienzo .djs-context-pad { transform: scale(.85); transform-origin: 0 0; }
}

.relato__volver { align-self: flex-start; text-align: left; margin: 0 0 var(--spacing-2); }
.relato__acc { margin-top: var(--spacing-3); }
.relato-prev .campo { margin-bottom: var(--spacing-2); }

/* Cabecera del proceso: guardado, deshacer, historial, versión y CTA */
.cab-herr { display: inline-flex; align-items: center; gap: 2px; margin-right: var(--spacing-1); }
.cab-herr .kz-save { margin-right: var(--spacing-1); }
.cab-cta { white-space: nowrap; }
@media (max-width: 640px) {
  .kz-versel__menu { min-width: min(260px, calc(100vw - 48px)); }
  .cab-herr .kz-save__txt { display: none; }
  .kz-head__top { align-items: center; }
  /* En el teléfono la miga actual repite el título: queda solo el regreso. */
  .kz-head__crumbs > span, .kz-head__crumbs .miga-act { display: none; }
  .kz-head__crumbs .miga::before { content: '‹ '; text-decoration: none; display: inline-block; margin-right: 2px; }
}

/* Contactos y RACI */

.contactos td { vertical-align: top; }

.contactos__cod code, .aprob__det code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .03em; background: var(--color-panel); padding: 2px 6px; border-radius: var(--radius-sm); white-space: nowrap; }
.contactos__cod { vertical-align: middle !important; }
.contactos__error, .aprob__falta, .selper__falta { display: block; font-size: 11.5px; color: var(--color-estado-mal); }
.kz-input--error { border-color: var(--color-estado-mal) !important; }

.selper { margin-bottom: var(--spacing-3); }
.selper__caja { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.selper__chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; border: 1px solid var(--color-borde); border-radius: var(--radius-full); background: var(--color-blanco); font-size: 13px; line-height: 18px; }
.selper__cargo { color: var(--color-apagado); }
.selper__falta { display: inline; }
.selper__x { width: 22px; height: 22px; border: 0; border-radius: var(--radius-full); background: var(--color-panel); color: var(--color-tinta); font-size: 15px; line-height: 1; cursor: pointer; }
.selper__x:hover { background: var(--color-borde); }
.selper__sel { width: auto; min-width: 150px; max-width: 100%; }
.aprob-rem { margin-top: var(--spacing-2); }
.aprob-pasos__l { margin: 0; padding-left: 20px; display: grid; gap: var(--spacing-2); font-size: 13.5px; }
.aprob-pasos__l li > span { margin-right: var(--spacing-2); }
.aprob__det { color: var(--color-apagado); }
.mcorreo { position: relative; display: inline-block; }
.mcorreo > summary { list-style: none; display: inline-flex; align-items: center; }
.mcorreo__car { display: inline-flex; margin-left: 4px; margin-right: -2px; transition: transform .15s; }
.mcorreo[open] .mcorreo__car { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .mcorreo__car { transition: none; } }
.mcorreo > summary::-webkit-details-marker { display: none; }
.mcorreo__menu { position: absolute; left: 0; top: calc(100% + 4px); z-index: 45; min-width: 190px; padding: 4px; background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.mcorreo__menu a, .mcorreo__menu button { font: inherit; font-size: 13px; text-align: left; padding: 7px 10px; border: 0; background: none; border-radius: var(--radius-sm); color: var(--color-tinta); text-decoration: none; cursor: pointer; }
.mcorreo__menu a:hover, .mcorreo__menu button:hover { background: var(--color-panel); }
.rmanual { display: grid; gap: var(--spacing-2); width: 100%; padding: var(--spacing-3); background: var(--color-panel); border-radius: var(--radius-md); }
.rmanual .kz-input { background: var(--color-blanco); }
.aprob-pegar { display: grid; gap: var(--spacing-2); }
.aprob-lectura { padding: var(--spacing-3); border: 1px solid var(--color-estado-bien-borde); background: var(--color-estado-bien-fondo); border-radius: var(--radius-md); }
.aprob-lectura p { margin: 0 0 var(--spacing-2); font-size: 13.5px; }
.aprob-lectura blockquote { margin: 0 0 var(--spacing-2); padding: 6px 10px; background: var(--color-blanco); border-radius: var(--radius-sm); font-size: 13px; }
.aprob-retirar { margin: var(--spacing-3) 0; }
.aprob-inf { justify-content: space-between; }
